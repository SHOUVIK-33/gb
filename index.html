<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PORICHOY · পৰিচয়</title>
<meta name="description" content="Porichoy — a love story in seven chapters. Written in Assam, for one name.">
<meta name="theme-color" content="#6d1f2c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- falling flowers -->
<canvas id="petals" aria-hidden="true"></canvas>

<!-- reading progress -->
<div class="progress" id="progress" aria-hidden="true"></div>

<!-- chapter dots -->
<nav class="dots" id="dots" aria-label="Chapters"></nav>

<!-- music button -->
<button class="music" id="musicBtn" type="button" aria-label="Play music" aria-pressed="false">
  <span class="music__ring"></span>
  <span class="music__ring music__ring--2"></span>
  <span class="music__icon" aria-hidden="true">♪</span>
  <span class="music__tip" id="musicTip">Mon Jai — Zubeen Garg</span>
</button>

<!-- ================= HERO ================= -->
<header class="hero" id="top">
  <div class="hero__glow" aria-hidden="true"></div>
  <div class="hero__inner">
    <p class="hero__kicker">অসমীয়া প্ৰেম · an Assamese love</p>

    <h1 class="hero__title" data-split>PORICHOY</h1>
    <p class="hero__as">পৰিচয়</p>

    <div class="hero__rule" aria-hidden="true"><span></span></div>

    <p class="hero__line">Seven chapters of a love<br>that never asked for anything back.</p>

    <p class="hero__names">
      <span>Ayush</span>
      <i aria-hidden="true">for</i>
      <span>Gayatri</span>
    </p>

    <a class="hero__cue" href="#sec1">
      <span class="hero__cueText">scroll</span>
      <span class="hero__cueLine" aria-hidden="true"></span>
    </a>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main id="main">

  <section class="sec" id="sec1" data-nav="Gayatri">
    <div class="wrap" data-render="sec1"></div>
  </section>

  <section class="sec" id="sec2" data-nav="Rong">
    <div class="wrap" data-render="sec2"></div>
  </section>

  <section class="sec sec--songs" id="sec3" data-nav="Xur">
    <div class="wrap" data-render="sec3"></div>
  </section>

  <section class="sec sec--story" id="sec4" data-nav="Prem Kahini">
    <div class="wrap" data-render="sec4"></div>
  </section>

  <section class="sec" id="sec5" data-nav="Xikha">
    <div class="wrap" data-render="sec5"></div>
  </section>

  <section class="sec sec--poems" id="sec6" data-nav="Kabita">
    <div class="wrap" data-render="sec6"></div>
  </section>

  <section class="sec sec--geet" id="sec7" data-nav="Geet">
    <div class="wrap" data-render="sec7"></div>
  </section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="foot">
  <div class="foot__orn" aria-hidden="true">❀</div>
  <p class="foot__line">Love asks no demands. It only needs a heart to do it.</p>
  <p class="foot__as">ভাল পোৱা · ভালপোৱা</p>
  <p class="foot__small">PORICHOY — written by Ayush, for Gayatri. Made in Assam.</p>
</footer>

<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
